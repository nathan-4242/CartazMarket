services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cartazmarket
      POSTGRES_USER: cartazmarket
      POSTGRES_PASSWORD: cartazmarket_local
    ports:
      - "5432:5432"
    volumes:
      - cartazmarket_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartazmarket -d cartazmarket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cartazmarket_postgres:
